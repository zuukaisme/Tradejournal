name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: "APK build variant to produce"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

permissions:
  contents: write

jobs:
  build:
    name: Build TradePulse APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Python 3.11 for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Accept Android SDK licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=""
          for candidate in \
            "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" \
            "${SDK_ROOT}"/cmdline-tools/*/bin/sdkmanager \
            "${SDK_ROOT}/tools/bin/sdkmanager" \
            "$(command -v sdkmanager 2>/dev/null || true)"; do
            if [ -n "${candidate}" ] && [ -x "${candidate}" ]; then
              SDKMANAGER="${candidate}"
              break
            fi
          done
          if [ -n "${SDKMANAGER}" ]; then
            set +o pipefail
            yes | "${SDKMANAGER}" --sdk_root="${SDK_ROOT}" --licenses > /dev/null || true
          fi

      - name: Restore debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Bundle Winlator Mali ARM64EC runtime
        run: |
          mkdir -p app/src/main/assets
          curl --fail --location --retry 5 --retry-all-errors "https://github.com/GunaCharanTeja/Winlator-Extras/releases/download/Sd/imagefs.tzst" --output app/src/main/assets/imagefs.tzst
          curl --fail --location --retry 5 --retry-all-errors "https://github.com/GunaCharanTeja/Winlator-Extras/releases/download/Sd/proton-10-arm64ec.tzst" --output app/src/main/assets/proton-10-arm64ec.tzst
          test "$(stat -c%s app/src/main/assets/imagefs.tzst)" -gt 190000000
          test "$(stat -c%s app/src/main/assets/proton-10-arm64ec.tzst)" -gt 190000000

      - name: Run Python backtester regression tests
        run: PYTHONPATH=app/src/main/python python -m unittest discover -s app/src/test/python -v

      - name: Run MT5 connector tests
        run: PYTHONPATH=mt5_connector python -m unittest discover -s mt5_connector -p 'test_*.py' -v

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build Debug APK
        if: ${{ inputs.build_type != 'release' }}
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload Debug APK
        if: ${{ inputs.build_type != 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: TradePulse-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct APK download
        if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && inputs.build_type != 'release' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tradepulse-debug-latest
          name: TradePulse Debug APK (Latest)
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare Release Keystore (optional)
        if: ${{ inputs.build_type == 'release' }}
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${UPLOAD_KEYSTORE_BASE64}" ]; then
            echo "Missing GitHub Secret UPLOAD_KEYSTORE_BASE64 (along with STORE_PASSWORD and KEY_PASSWORD)."
            exit 1
          fi
          echo "${UPLOAD_KEYSTORE_BASE64}" | base64 -d > my-upload-key.jks

      - name: Build Release APK
        if: ${{ inputs.build_type == 'release' }}
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon

      - name: Upload Release APK
        if: ${{ inputs.build_type == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: TradePulse-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
