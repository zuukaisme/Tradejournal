<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TradePulse Chart</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #0a0f19;
  }
  #tv_chart_container {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
  }
</style>
<script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
</head>
<body>
<div id="tv_chart_container"></div>
<script type="text/javascript">
  (function () {
    var params = new URLSearchParams(window.location.search);
    var symbol = params.get("symbol") || "FX:EURUSD";
    var interval = params.get("interval") || "15";
    var theme = params.get("theme") || "dark";
    document.body.style.background = theme === "light" ? "#FFFFFF" : "#0a0f19";

    function mountWidget() {
      if (typeof TradingView === "undefined" || !TradingView.widget) {
        if (window.ChartBridge && window.ChartBridge.onChartError) {
          window.ChartBridge.onChartError("TradingView script (tv.js) failed to initialize.");
        }
        return;
      }
      new TradingView.widget({
        autosize: true,
        symbol: symbol,
        interval: interval,
        timezone: "Etc/UTC",
        theme: theme,
        style: "1",
        locale: "en",
        enable_publishing: false,
        allow_symbol_change: true,
        withdateranges: true,
        hide_side_toolbar: true,
        save_image: false,
        container_id: "tv_chart_container"
      });
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", mountWidget);
    } else {
      mountWidget();
    }
  })();
</script>
</body>
</html>
